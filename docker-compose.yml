services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kriyon
      POSTGRES_PASSWORD: kriyon
      POSTGRES_DB: kriyon_bd
    ports:
      - "5432:5432"
    volumes:
      - kriyon_bd_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kriyon -d kriyon_bd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kriyon_bd_pgdata:
